# Configuracao do deploy no Render (Blueprint).
#
# O server.js nao tem dependencias externas: usa so modulos nativos do Node.
# Por isso o build e vazio e o start e direto.
#
# As chaves NAO ficam aqui. "sync: false" faz o Render pedir o valor de cada
# uma na hora de criar o servico, e guarda como variavel de ambiente secreta.
services:
  - type: web
    name: advogacert
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"

      # Endereco DESTE servidor. E com ele que se monta o redirect_uri
      # mandado ao Google (.../auth/google/callback), entao tem de ser o
      # dominio que realmente responde /auth/google/callback — o do Render.
      #
      # Nao troque por www.agentej.us: aquele dominio e GitHub Pages, so serve
      # arquivos, e o Google devolveria o login num 404. O cliente e levado de
      # volta a www.agentej.us pelo parametro ?retorno=, no fim do fluxo.
      #
      # Este mesmo valor precisa estar cadastrado no Google Cloud Console, em
      # "Authorized redirect URIs".
      - key: OAUTH_BASE_URL
        value: https://advogacert.onrender.com

      # Banco de dados (Supabase). Sem isto o servidor cai no usuarios.json,
      # que no Render e apagado a cada deploy — cadastros e assinaturas somem.
      # A service_key ignora o RLS: e chave de servidor, nunca vai para o HTML.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

      # envio de e-mail (boas-vindas, recuperacao de senha, codigo de acesso)
      - key: BREVO_API_KEY
        sync: false

      # chat PjeGPT
      - key: DEEPSEEK_API_KEY
        sync: false

      # painel /admin.html — sem a senha, o painel fica bloqueado
      - key: ADMIN_SENHA
        sync: false
      - key: ADMIN_TOTP_SECRET
        sync: false

      # login com Google (opcional)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      # pagamento Mercado Pago (opcional)
      - key: MP_LINK
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_EMAIL_AVISO
        sync: false
