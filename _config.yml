# Arquivos que NAO devem ser publicados no GitHub Pages.
#
# O Pages so serve arquivos estaticos: os .php nao sao executados, seriam
# baixados como codigo-fonte, e o painel admin nao tem servidor por tras.
# Nada aqui e segredo (o repositorio e publico), mas tambem nao precisa
# estar exposto no dominio do site.
exclude:
  - admin.html
  - server.js
  # Corpos de e-mail: quem os le e o servidor, via montarEmail(). No Pages
  # virariam paginas publicas em www.agentej.us/email-....html.
  - email-otp.html
  - email-boasvindas.html
  - email-pedido-recebido.html
  - email-atendimento-marcado.html
  - db_config.php
  - gpt.php
  - login.php
  - logout.php
  - lib
  - package.json
  - package2.json
  - iniciar-servidor.bat
  - iniciar-servidor.ps1
  - CLAUDE.md
  - claudeignore
  - supabase_schema.sql
  - migrar_para_supabase.js
  - render.yaml
